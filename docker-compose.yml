services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.31.3
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

